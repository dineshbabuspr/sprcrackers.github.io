<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vilvam Crackers – Order Form 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#1d1650;--gold:#ffb000;--paper:#f6f5fb;--card:#fff;--ink:#1b1a2e;--muted:#6b6985;--line:#e4e2ef;--wa:#128c4a;--hh:150px;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:20;background:var(--night);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;box-shadow:0 3px 14px rgba(20,10,60,.35)}
.brand{font:800 18px/1.1 "Baloo 2",system-ui,sans-serif;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand small{font:600 12px Nunito,sans-serif;color:#b9b4e6}
.tot{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}
.tile{border-radius:12px;padding:8px 12px;background:rgba(255,255,255,.1)}
.tile span{display:block;font-size:12px;color:#cfcaf5}
.tile b{font:800 22px/1.1 "Baloo 2",system-ui,sans-serif}
.tile.pay{background:var(--gold);color:#2a1a00}
.tile.pay span{color:#5a3b00}
.tile.pay b{font-size:26px}
.tools{margin-top:8px}
#q{width:100%;border:0;border-radius:10px;padding:11px 14px;font:600 16px Nunito,sans-serif;background:#fff;color:var(--ink)}
#q:focus,input:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:99px;padding:5px 12px;font:600 13px Nunito,sans-serif;white-space:nowrap}
main{padding:12px 12px 0;max-width:720px;margin:0 auto}
details{background:var(--card);border-radius:14px;margin-bottom:10px;border:1px solid var(--line);scroll-margin-top:calc(var(--hh) + 8px);overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:8px;font:800 17px "Baloo 2",system-ui,sans-serif}
summary::-webkit-details-marker{display:none}
summary .cnt{font:600 13px Nunito,sans-serif;color:var(--muted);margin-left:auto}
summary .sel{background:var(--gold);color:#2a1a00;border-radius:99px;font:700 12px Nunito,sans-serif;padding:2px 9px}
summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 6px;transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.item{padding:11px 14px;border-top:1px solid var(--line);border-left:4px solid transparent}
.item.on{border-left-color:var(--gold);background:#fffaf0}
.nm{font-weight:700}
.nm i{font:600 12px Nunito,sans-serif;color:var(--muted);font-style:normal;margin-right:6px}
.meta{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.pr s{color:var(--muted);font-size:13px;margin-right:6px}
.pr b{font:800 18px "Baloo 2",sans-serif;color:var(--night)}
.ln{font-size:12px;color:#8a5a00;font-weight:700;min-height:16px}
.st{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.st button{width:44px;height:44px;border:0;background:#f0eefa;font:700 22px Nunito,sans-serif;color:var(--night)}
.st button:active{background:var(--gold)}
.st input{width:46px;height:44px;border:0;text-align:center;font:700 17px Nunito,sans-serif;-moz-appearance:textfield}
.st input::-webkit-outer-spin-button,.st input::-webkit-inner-spin-button{-webkit-appearance:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
#fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:62px;height:62px;border-radius:50%;border:0;background:#25d366;box-shadow:0 6px 18px rgba(0,0,0,.3);display:grid;place-items:center}
#fab svg{width:34px;height:34px;fill:#fff}
#fab .bd{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;border-radius:12px;background:#d6246e;color:#fff;font:700 13px/24px Nunito,sans-serif;padding:0 6px;text-align:center}
#ov{position:fixed;inset:0;z-index:40;background:rgba(15,10,40,.6);display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font:800 20px "Baloo 2",sans-serif;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:#f0eefa;width:38px;height:38px;border-radius:50%;font-size:20px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.f{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:600 16px Nunito,sans-serif;background:#fff;color:var(--ink)}
textarea.f{resize:vertical;min-height:62px}
.sl{margin:14px 0 4px;border-top:1px dashed var(--line)}
.si{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.si small{display:block;color:var(--muted)}
.si b{white-space:nowrap}
.sum{margin:12px 0;font-size:15px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .big{font:800 20px "Baloo 2",sans-serif;color:var(--night);border-top:2px solid var(--night);margin-top:6px;padding-top:8px}
.err{color:#b3261e;font-weight:700;font-size:14px;min-height:20px}
.send{width:100%;border:0;border-radius:14px;background:var(--wa);color:#fff;font:800 18px "Baloo 2",sans-serif;padding:13px;display:flex;align-items:center;justify-content:center;gap:10px}
.send svg{width:26px;height:26px;fill:#fff}
.clr{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font:600 14px Nunito,sans-serif;padding:8px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}summary::after{transition:none}}
</style>
</head>

  let m = 0, n = 0, per = {};
  Object.keys(qty).forEach(id => { m += qty[id] * items[id].mrp; n++; });
  DATA.forEach((c, ci) => { const k = c.items.filter(i => qty[i.id]).length; const s = $("cat" + ci).querySelector(".sel"); s.hidden = !k; s.textContent = k + " added" });
  $("tMrp").textContent = fmt(m); $("tPay").textContent = fmt(pay(m));
  $("bd").hidden = !n; $("bd").textContent = n;
  return { m, n };
}
$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.closest(".item").dataset.id;
  setQty(id, (qty[id] || 0) + (b.dataset.a === "+" ? 1 : -1));
});
$("list").addEventListener("change", e => { if (e.target.matches(".st input")) setQty(e.target.closest(".item").dataset.id, e.target.value) });
$("list").addEventListener("focusin", e => { if (e.target.matches(".st input")) e.target.select() });

$("chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("q").value = ""; filter();
  const d = $("cat" + b.dataset.c); d.open = true; d.scrollIntoView();
});
function filter() {
  const t = $("q").value.trim().toLowerCase(); let any = false;
  DATA.forEach((c, ci) => {
    const d = $("cat" + ci); let hit = 0;
    d.querySelectorAll(".item").forEach(el => {
      const i = items[el.dataset.id];
      const ok = !t || (i.id + " " + i.name + " " + c.name).toLowerCase().includes(t);
      el.hidden = !ok; if (ok) hit++;
    });
    d.hidden = !hit; if (hit) any = true;
    if (t) d.open = true;
  });
  $("none").hidden = any;
}
$("q").addEventListener("input", filter);

function buildMsg() {
  const { m } = totals();
  const ids = Object.keys(qty);
  let t = `🎆 *Order – ${STORE} 2026*\n\n👤 ${info.n}\n📞 ${info.p}\n`;
  if (info.a) t += `📍 ${info.a}\n`;
  t += `\n*Items*\n`;
  ids.forEach((id, k) => { const i = items[id]; t += `${k + 1}. [${id}] ${i.name} – ${qty[id]} × ${fmt(i.mrp)} = ${fmt(qty[id] * i.mrp)}\n` });
  t += `\n*Total price: ${fmt(m)}*\n*After ${DISCOUNT}% discount: ${fmt(pay(m))}*`;
  return t;
}
function openSheet() {
  $("cn").value = info.n || ""; $("cp").value = info.p || ""; $("ca").value = info.a || "";
  const { m, n } = totals(), ids = Object.keys(qty);
  $("items").innerHTML = n ? ids.map(id => { const i = items[id], v = qty[id]; return `<div class="si"><div>${esc(i.name)}<small>${v} × ${fmt(i.mrp)}</small></div><b>${fmt(v * i.mrp)}</b></div>` }).join("") : '<div class="empty">No items yet. Close this and tap + on the products you want.</div>';
  $("sum").innerHTML = n ? `<div><span>Total price</span><span>${fmt(m)}</span></div><div><span>Discount (${DISCOUNT}%)</span><span>− ${fmt(m - pay(m))}</span></div><div class="big"><span>You pay</span><span>${fmt(pay(m))}</span></div>` : "";
  $("err").textContent = ""; $("ov").classList.add("show"); document.body.style.overflow = "hidden";
}
const closeSheet = () => { $("ov").classList.remove("show"); document.body.style.overflow = "" };
$("fab").onclick = openSheet; $("cl").onclick = closeSheet;
$("ov").addEventListener("click", e => { if (e.target === $("ov")) closeSheet() });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet() });
["cn", "cp", "ca"].forEach(id => $(id).addEventListener("input", () => { info = { n: $("cn").value.trim(), p: $("cp").value.trim(), a: $("ca").value.trim() }; save() }));
$("clear").onclick = () => { if (confirm("Remove all items from your order?")) { Object.keys(qty).forEach(id => { delete qty[id]; paintRow(id) }); totals(); save(); openSheet() } };
$("send").onclick = () => {
  info = { n: $("cn").value.trim(), p: $("cp").value.trim(), a: $("ca").value.trim() }; save();
  const digits = info.p.replace(/\D/g, "");
  if (!Object.keys(qty).length) return $("err").textContent = "Add at least one item to your order.";
  if (!info.n) return $("err").textContent = "Please enter your name.";
  if (digits.length < 10) return $("err").textContent = "Please enter a valid 10-digit mobile number.";
  const url = "https://wa.me/" + WHATSAPP_NUMBER.replace(/\D/g, "") + "?text=" + encodeURIComponent(buildMsg());
  if (!window.open(url, "_blank")) location.href = url;
};
const setHH = () => document.documentElement.style.setProperty("--hh", $("hd").offsetHeight + "px");
addEventListener("resize", setHH); setHH();
Object.keys(qty).forEach(paintRow); totals();
const first = document.querySelector("details"); if (first) first.open = true;
</script>
</body>
</html>
